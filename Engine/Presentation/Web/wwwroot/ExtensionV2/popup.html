<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 220px;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 12px;
            margin: 0;
            background-color: #1e1e2e;
            color: #cdd6f4;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
        }
        .dot.connected {
            background-color: #22c55e;
        }
        .info {
            font-size: 11px;
            color: #a6adc8;
            word-break: break-all;
        }
        button {
            width: 100%;
            margin-top: 10px;
            padding: 6px;
            background: #89b4fa;
            border: none;
            border-radius: 4px;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #b4befe;
        }
    </style>
</head>
<body>
<div class="status-container">
    <div id="statusDot" class="dot"></div>
    <strong id="statusText">Desconectado</strong>
</div>
<div id="serverUrl" class="info">ws://...</div>
<button id="btnReconnect">Reconectar</button>

<script type="module" src="popup.js"></script>
</body>
</html>
